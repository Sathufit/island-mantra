name: Keep Render backend awake

on:
  schedule:
    # Every 20 minutes. Render's free plan spins down after 15 min idle, so
    # this lets it sleep for ~5 of every 20 minutes instead of never sleeping
    # at all (a 10-min ping keeps it awake 24/7, which alone burns ~99% of
    # the workspace's shared 750 free-instance-hour/month pool). This trades
    # an occasional cold start (~50s) for meaningfully lower instance-hour
    # usage, roughly a 25% reduction.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # Render's free-tier cold start for this backend regularly exceeds
        # 90s (DB connect + migrations check + Medusa bootstrap), so a
        # single request timing out isn't a real failure - it's often the
        # request that woke the dyno. Poll instead of doing one long wait,
        # so the job succeeds once the backend actually finishes booting.
        run: |
          for i in $(seq 1 18); do
            if curl -fsS --max-time 15 https://island-mantra-backend.onrender.com/health; then
              echo "Backend is awake (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: backend not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Backend did not respond after ~4.5 minutes"
          exit 1
